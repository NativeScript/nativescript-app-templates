name: '@nativescript/template-* -> test'

on: push

# a newer push to the same branch supersedes any run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only templates whose files changed are built; anything they all share
  # (shared-mobile, prepareTemplates.js, the root package files, this
  # workflow) rebuilds every template. Vision and Solid templates are not
  # built here, so the list below is the universe, not the packages dir.
  changes:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: list
        env:
          BEFORE: ${{ github.event.before }}
          ALL: |
            template-blank
            template-blank-vue-ts
            template-hello-world-ng
            template-tab-navigation
            template-blank-ng
            template-drawer-navigation
            template-hello-world-ts
            template-tab-navigation-ng
            template-blank-react
            template-drawer-navigation-ng
            template-master-detail
            template-tab-navigation-ts
            template-blank-svelte
            template-drawer-navigation-ts
            template-master-detail-ng
            template-tab-navigation-vue
            template-blank-ts
            template-drawer-navigation-vue
            template-master-detail-ts
            template-blank-vue
            template-hello-world
            template-master-detail-vue
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            base=$BEFORE
          else
            base=$(git merge-base origin/main HEAD)
          fi
          changed=$(git diff --name-only "$base" HEAD | grep -vE '\.md$' || true)

          if [ -z "$changed" ]; then
            selected=""
          elif echo "$changed" | grep -qvE '^packages/template-[^/]+/'; then
            selected=$ALL
          else
            changedDirs=$(echo "$changed" | grep -oE '^packages/template-[^/]+' | xargs -n1 basename | sort -u)
            selected=$(comm -12 <(echo "$ALL" | sort) <(echo "$changedDirs"))
          fi

          templates=$(printf '%s\n' $selected | grep . | jq -R . | jq -sc .)
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
          echo "Building: $templates"

  build:
    needs: changes
    if: needs.changes.outputs.templates != '[]'
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.template }} ${{ matrix.platform }}

    # Android needs nothing from macOS, so it builds on Linux: cheaper, and
    # it does not queue behind the small pool of concurrent macOS runners.
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.changes.outputs.templates) }}
        platform: [ios, android]
        include:
          - platform: ios
            os: macos-15
          - platform: android
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          path: 'templates'

      - if: matrix.platform == 'ios'
        uses: actions/setup-python@v7
        with:
          python-version: '3'

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # keyed on the template's own package.json: the app created from it
      # is what npm installs, not the repo root
      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.template }}-${{ hashFiles(format('templates/packages/{0}/package.json', matrix.template), 'templates/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ matrix.template }}-
            ${{ runner.os }}-npm-

      - if: matrix.platform == 'android'
        name: Cache Gradle
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-gradle-cache-${{ hashFiles('**/package-lock.json') }}-v1
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Setup
        working-directory: templates
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            python3 -m pip install --upgrade pip six
          fi
          npm i -g nativescript@next --ignore-scripts
          ns usage-reporting disable
          ns error-reporting disable
          ns -v
          ns doctor ${{ matrix.platform }} || true

          npm install
          npm run prepare-templates

      - name: Create app from template
        env:
          TEMPLATE_NAME: ${{ matrix.template }}
        run: |
          echo "---"
          echo "Creating myApp using template: $(pwd)/templates/packages/$TEMPLATE_NAME"
          echo "---"
          ns create myApp --template="$(pwd)/templates/packages/$TEMPLATE_NAME"
          cd myApp
          npm install

      - name: Build
        working-directory: myApp
        run: ns build ${{ matrix.platform }}
